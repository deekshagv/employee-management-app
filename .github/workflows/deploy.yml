
name: Employee Management CI/CD

on:
  push:
    branches:
      - dev
      - staging
      - prod
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  FRONTEND_BUCKET: employee-management-frontend-722020111394

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Identify environment
        run: |
          echo "Current branch: $GITHUB_REF_NAME"

          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "Development environment"
            echo "STACK_NAME=employee-management-api-dev" >> $GITHUB_ENV
          elif [ "$GITHUB_REF_NAME" = "staging" ]; then
            echo "Staging environment"
            echo "STACK_NAME=employee-management-api-staging" >> $GITHUB_ENV
          elif [ "$GITHUB_REF_NAME" = "prod" ]; then
            echo "Production environment"
            echo "STACK_NAME=employee-management-api-prod" >> $GITHUB_ENV
          else
            echo "Unsupported branch"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build SAM application
        working-directory: backend
        run: sam build

      - name: Deploy SAM application
        working-directory: backend
        run: |
          sam deploy \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Deploy frontend to S3
        if: github.ref_name == 'dev'
        run: |
          aws s3 sync frontend/ s3://$FRONTEND_BUCKET/ --delete
